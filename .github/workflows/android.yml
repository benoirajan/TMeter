name: Build TMeter Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Project Source
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    # Generate Gradle wrapper dynamically on the runner
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.2

    - name: Grant Execute Permission to gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      if: ${{ secrets.SIGNING_KEY != '' }}
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/release.keystore

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: tmeter-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Build Release APK
      env:
        KEYSTORE_FILE: release.keystore
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: tmeter-release-apk
        path: app/build/outputs/apk/release/*.apk


